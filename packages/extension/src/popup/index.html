<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Capture</title>
  <style>
    body {
      width: 320px;
      min-height: 400px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1a1a2e;
      color: #fff;
    }

    .header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 18px;
      font-weight: 600;
    }

    .subtitle {
      color: #888;
      font-size: 13px;
      margin: 0;
    }

    .status {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .status-label {
      color: #888;
    }

    .status-value {
      color: #fff;
      font-weight: 500;
    }

    .recording-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #f44336;
      font-weight: 600;
    }

    .recording-dot {
      width: 8px;
      height: 8px;
      background: #f44336;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: #4caf50;
      color: white;
    }

    .btn-primary:hover {
      background: #45a049;
    }

    .btn-danger {
      background: #f44336;
      color: white;
    }

    .btn-danger:hover {
      background: #da190b;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .privacy-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }

    .checkbox-group {
      margin-bottom: 8px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #ccc;
      cursor: pointer;
      padding: 6px 0;
    }

    .checkbox-label input {
      cursor: pointer;
    }

    .recordings {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .recording-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .recording-name {
      font-weight: 500;
      margin-bottom: 4px;
    }

    .recording-meta {
      color: #888;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Screen Capture</h1>
    <p class="subtitle">Record user sessions</p>
  </div>

  <div class="status">
    <div class="status-row">
      <span class="status-label">Status:</span>
      <span class="status-value" id="status">Idle</span>
    </div>
    <div class="status-row">
      <span class="status-label">Events:</span>
      <span class="status-value" id="event-count">0</span>
    </div>
    <div class="status-row">
      <span class="status-label">Duration:</span>
      <span class="status-value" id="duration">0s</span>
    </div>
  </div>

  <button class="btn btn-primary" id="start-btn">Start Recording</button>
  <button class="btn btn-danger" id="stop-btn" disabled>Stop Recording</button>

  <div class="privacy-section">
    <div class="section-title">Privacy Settings</div>
    <div class="checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" id="mask-inputs">
        Mask all inputs
      </label>
    </div>
    <div class="checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" id="block-sensitive">
        Block sensitive elements
      </label>
    </div>
  </div>

  <div class="recordings">
    <div class="section-title">Recent Recordings</div>
    <div id="recordings-list">
      <p style="color: #888; font-size: 12px; text-align: center;">No recordings yet</p>
    </div>
  </div>

  <script type="module" src="./index.ts"></script>
</body>
</html>
